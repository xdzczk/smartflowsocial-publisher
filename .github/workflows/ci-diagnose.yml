name: CI diagnose
on:
  push:
    branches: [ci-diagnose]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace promise chains
        run: |
          set +e
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/core/PublishEngine.ts';
          const source = fs.readFileSync(path, 'utf8');
          const marker = 'pendingPromises.set(relay.url, publishPromise)';
          const start = source.indexOf(marker);
          const end = source.indexOf('executing.add(wrappedPromise);', start);
          fs.writeFileSync('/tmp/patch-debug.txt', JSON.stringify({
            start, end, slice: start < 0 ? '' : source.slice(start, start + 1500)
          }, null, 2));
          if (start < 0 || end < 0) process.exit(2);
          const replacement = `pendingPromises.set(relay.url, publishPromise);

    let wrappedPromise: Promise<RelayResult | undefined>;
    wrappedPromise = (async () => {
      try {
        const result = await publishPromise;
        results.push(result);
        pendingPromises.delete(relay.url);
        onResult(result);
        return result;
      } catch {
        return undefined;
      } finally {
        executing.delete(wrappedPromise);
      }
    })();

    executing.add(wrappedPromise);`;
          const next = source.slice(0, start) + replacement + source.slice(end + 'executing.add(wrappedPromise);'.length);
          fs.writeFileSync(path, next);
          NODE
          echo "PATCH_EXIT:$?" | tee /tmp/patch-exit.txt
          pnpm exec prettier --write src/core/PublishEngine.ts || true
          {
            echo "=== patch ==="
            cat /tmp/patch-exit.txt
            echo "=== debug ==="
            head -c 2000 /tmp/patch-debug.txt
            echo
            echo "=== eslint ==="
            pnpm exec eslint src/core/PublishEngine.ts
            echo "ESLINT_EXIT:$?"
            echo "=== prettier ==="
            pnpm exec prettier --check src/core/PublishEngine.ts
            echo "PRETTIER_EXIT:$?"
            echo "=== typecheck ==="
            pnpm typecheck
            echo "TYPE_EXIT:$?"
          } > diagnose-summary.md 2>&1 || true
          git config user.name "xdzczk"
          git config user.email "ivmitko@icloud.com"
          git add src/core/PublishEngine.ts diagnose-summary.md
          git commit -m "fix: await relay publish cleanup" || true
          git push || true
