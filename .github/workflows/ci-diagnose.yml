name: CI diagnose
on:
  push:
    branches: [ci-diagnose]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace promise chains
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/core/PublishEngine.ts';
          const source = fs.readFileSync(path, 'utf8');
          const old = `    pendingPromises.set(relay.url, publishPromise);

    // Wrap the promise to handle result processing and cleanup
    // eslint-disable-next-line promise/prefer-await-to-then -- Promise chain needed for cleanup logic
    const wrappedPromise = publishPromise.then((result) => {
      results.push(result);
      pendingPromises.delete(relay.url);

      onResult(result);

      // Removed abort logic - remaining publishes will continue in background

      return result;
    });

    // Clean up from executing set when done
    // eslint-disable-next-line promise/prefer-await-to-then -- Cleanup chain needed
    wrappedPromise
      .finally(() => {
        executing.delete(wrappedPromise);
        // eslint-disable-next-line promise/prefer-await-to-then -- Error handling in cleanup
      })
      .catch(() => {
        // Ignore errors in cleanup
      });

    executing.add(wrappedPromise);`;
          const replacement = `    pendingPromises.set(relay.url, publishPromise);

    let wrappedPromise: Promise<RelayResult | undefined>;
    wrappedPromise = (async () => {
      try {
        const result = await publishPromise;
        results.push(result);
        pendingPromises.delete(relay.url);
        onResult(result);
        return result;
      } catch {
        // Cleanup must not surface a rejection to the concurrency pool.
        return undefined;
      } finally {
        executing.delete(wrappedPromise);
      }
    })();

    executing.add(wrappedPromise);`;
          if (!source.includes(old)) {
            const idx = source.indexOf('pendingPromises.set(relay.url, publishPromise)');
            console.error('target block not found');
            console.error(JSON.stringify(source.slice(Math.max(0, idx), idx + 1200)));
            process.exit(1);
          }
          fs.writeFileSync(path, source.replace(old, replacement));
          NODE
          pnpm exec prettier --write src/core/PublishEngine.ts
      - name: Check the fixed file
        run: |
          set +e
          {
            echo "=== prettier file ==="
            pnpm exec prettier --check src/core/PublishEngine.ts
            echo "PRETTIER_EXIT:$?"
            echo "=== eslint file ==="
            pnpm exec eslint src/core/PublishEngine.ts
            echo "ESLINT_EXIT:$?"
            echo "=== eslint repo ==="
            pnpm exec eslint .
            echo "ESLINT_REPO_EXIT:$?"
            echo "=== typecheck ==="
            pnpm typecheck
            echo "TYPE_EXIT:$?"
          } > ci-diagnose.txt 2>&1
          exit 0
      - name: Publish fix
        run: |
          git config user.name "xdzczk"
          git config user.email "ivmitko@icloud.com"
          git add src/core/PublishEngine.ts ci-diagnose.txt
          git commit -m "fix: await relay publish cleanup"
          git push
