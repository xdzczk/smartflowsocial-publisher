name: Apply promise lint fix

on:
  push:
    branches:
      - fix/publisher-promise-lint

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/publisher-promise-lint

      - name: Rewrite the relay cleanup chain
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/core/PublishEngine.ts';
          let source = fs.readFileSync(path, 'utf8');
          if (source.includes('Keep relay failures inside the pool')) {
            console.log('already patched');
            process.exit(0);
          }
          const oldSet = 'const executing = new Set<Promise<RelayResult>>();';
          const newSet = 'const executing = new Set<Promise<RelayResult | undefined>>();';
          if (!source.includes(oldSet)) {
            console.error('set declaration missing');
            process.exit(1);
          }
          source = source.replace(oldSet, newSet);
          const startMarker = '    pendingPromises.set(relay.url, publishPromise);';
          const endMarker = '    executing.add(wrappedPromise);';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) {
            console.error('cleanup block missing', start, end);
            process.exit(1);
          }
          const replacement = `    pendingPromises.set(relay.url, publishPromise);

    // Keep relay failures inside the pool so Promise.race is not rejected.
    const wrappedPromise: Promise<RelayResult | undefined> = (async () => {
      try {
        const result = await publishPromise;
        results.push(result);
        pendingPromises.delete(relay.url);
        onResult(result);
        return result;
      } catch {
        return undefined;
      } finally {
        executing.delete(wrappedPromise);
      }
    })();

    executing.add(wrappedPromise);`;
          const next = source.slice(0, start) + replacement + source.slice(end + endMarker.length);
          fs.writeFileSync(path, next);
          NODE

      - name: Commit the source fix
        run: |
          if git diff --quiet -- src/core/PublishEngine.ts; then
            echo "no source changes"
            exit 0
          fi
          git config user.name "xdzczk"
          git config user.email "ivmitko@icloud.com"
          git add src/core/PublishEngine.ts
          git commit -m "fix: await relay publish cleanup"
          git push
